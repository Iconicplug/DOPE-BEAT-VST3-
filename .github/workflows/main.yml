name: Build DOPE BEAT (Windows VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Carga el compilador MSVC (cl.exe) sin depender de la version de Visual Studio
      - name: Entorno MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Asegurar Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          ninja --version

      - name: Configurar (Ninja, sin Visual Studio generator)
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter *.vst3 | Select-Object -First 1
          if (-not $vst) { throw "No se genero el .vst3" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $vst.FullName -Destination dist -Recurse
          $dll = Get-ChildItem $vst.FullName -Recurse -File -Filter *.vst3 | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName -Destination "dist\DOPE BEAT.dll" }
          Get-ChildItem dist -Recurse | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: DOPE-BEAT-VST3-Windows
          path: dist
